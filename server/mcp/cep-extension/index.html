<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      margin: 12px;
      background: #2a2a2a;
      color: #ccc;
    }
    #status {
      font-weight: bold;
      margin-bottom: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      background: #3a3a3a;
    }
    #status.connected { color: #4caf50; }
    #status.disconnected { color: #f44336; }
    #status.connecting { color: #ff9800; }
    button {
      background: #555;
      color: #eee;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    button:hover { background: #666; }
    #error-box {
      margin-top: 8px;
      padding: 6px 8px;
      background: #3a2020;
      border-radius: 4px;
      color: #f88;
      font-size: 11px;
      display: none;
      word-break: break-word;
    }
    label { font-size: 11px; color: #999; }
    input[type=text] {
      width: 60px;
      background: #3a3a3a;
      color: #eee;
      border: 1px solid #555;
      padding: 3px 5px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="status" class="disconnected">Disconnected</div>
  <div>
    <button id="reconnect-btn">Reconnect</button>
    <label>Port: <input type="text" id="port-input" value="17923" /></label>
  </div>
  <div id="error-box"></div>
  <script src="src/CSInterface.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
