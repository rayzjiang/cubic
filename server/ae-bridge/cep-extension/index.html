<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      margin: 12px;
      background: #2a2a2a;
      color: #ccc;
    }
    #status {
      font-weight: bold;
      margin-bottom: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      background: #3a3a3a;
    }
    #status.connected { color: #4caf50; }
    #status.disconnected { color: #f44336; }
    #status.connecting { color: #ff9800; }
    #error-box {
      margin-top: 8px;
      padding: 6px 8px;
      background: #3a2020;
      border-radius: 4px;
      color: #f88;
      font-size: 11px;
      display: none;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <!-- Headless AE bridge worker (Role B): no controls — port is hardcoded (17923) and
       reconnect is automatic. This status line is a dev-only "is the worker alive?" glance;
       it disappears entirely once §B makes the extension invisible. -->
  <div id="status" class="disconnected">Disconnected</div>
  <div id="error-box"></div>
  <script src="src/CSInterface.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
